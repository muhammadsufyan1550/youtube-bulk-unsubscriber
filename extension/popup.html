<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Bulk Unsubscriber</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-text {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #cc0000;
      color: #fff;
    }
    .btn-primary:hover {
      background: #ff0000;
    }
    .btn-secondary {
      background: #272727;
      color: #3ea6ff;
      border: 1px solid #3e3e3e;
    }
    .btn-secondary:hover {
      background: #333;
    }
    .footer {
      font-size: 10px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="icon">
    <h1>YT Bulk Unsubscriber</h1>
  </div>

  <div class="card">
    <div id="status-desc" class="status-text">Checking active tab...</div>
    <button id="action-btn" class="btn btn-primary" style="display:none;">⚡ Launch HUD</button>
  </div>

  <div class="footer">100% Client-Side • Privacy First</div>

  <script src="popup.js"></script>
</body>
</html>
